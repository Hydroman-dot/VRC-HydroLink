name: Prepare GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/HydroLink.App/HydroLink.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and application version must match.' }
      - name: Build and test application and updater
        shell: pwsh
        run: ./build.ps1 -Publish
      - name: Create draft with package and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/HydroLink.App/HydroLink.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $package = "artifacts/VRC-HydroLink-$version-win-x64.zip"
          gh release create $env:GITHUB_REF_NAME $package "$package.sha256" artifacts/HydroLink-Updater.zip --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "HydroLink $version" --notes "Windows-Paket mit SHA256-Pruefsumme und portablem Updater. Vor der Veroeffentlichung Praxistest und Release-Hinweise ergaenzen."
          if ($LASTEXITCODE) { throw 'Draft release creation failed.' }
